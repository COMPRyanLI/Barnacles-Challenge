[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barnacles"
version = "0.1.0"
description = "Tiled YOLO11n barnacle detection and inner-frame counting prototype"
requires-python = ">=3.10"
# Exact, tested versions live in requirements-lock.txt.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics==8.4.182",
    "numpy>=1.26",
    "Pillow>=10",
    "opencv-python>=4.8",
    "PyYAML>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
barnacles = "barnacles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "training: runs Ultralytics training (needs weights/yolo11n.pt; slow)",
    "gpu: requires a CUDA device",
]
filterwarnings = ["error::RuntimeWarning"]
